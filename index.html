<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حجز تذاكر الحفلة</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

    }

    body {
      font-family: 'Tahoma', 'Segoe UI', sans-serif;
      background-color: #f8fcff;
      color: #355c8a;
      line-height: 1.6;
      background-image: url("photo.jpg");
      background-size: cover;

    }

    /* ===== الهيدر ===== */
    .hero {
      background: linear-gradient(180deg, rgba(15, 15, 20, 0.3), #f8fcff 90%),
        #e8f5ff;
      text-align: center;
      padding: 60px 20px 40px;
      border-bottom: 3px solid #ef78aa;
    }

    .hero h1 {
      font-size: 40px;
      color: #ef78aa;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 18px;
      color: #6d8298;
    }

    .hero .event-info {
      margin-top: 20px;
      font-size: 16px;
      color: #355c8a;
    }

    .hero .event-info span {
      display: inline-block;
      margin: 0 12px;
      padding: 6px 14px;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid #ef78aa;
      border-radius: 20px;
    }

    /* ===== قسم خريطة الكراسي ===== */
    .seats-section {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: center;

    }

    .seats-section h2 {
      margin-bottom: 8px;
      color: #ef78aa;
      font-size: 26px;
    }

    .seats-section .hint {
      color: #8aa0b5;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .stage {
      background: #d9efff;
      color: #6d8298;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 30px;
      font-size: 14px;
      letter-spacing: 4px;
    }

    .seat-row {
      display: block;
      margin-bottom: 10px;
    }

    .row-label {
      display: inline-block;
      width: 24px;
      text-align: center;
      color: #8aa0b5;
      font-size: 13px;
      vertical-align: middle;
    }

    .seat {
      display: inline-block;
      width: 30px;
      height: 30px;
      margin: 3px;
      border-radius: 6px 6px 2px 2px;
      background: #edf8ff;
      border: 1px solid #c7e3f5;
      cursor: pointer;
      vertical-align: middle;
      font-size: 11px;
      color: #8aa0b5;
      text-align: center;
      line-height: 30px;
    }

    .seat:hover {
      border-color: #ef78aa;
    }

    .seat.vip {
      background: #fff2d2;
      border-color: #f1c86b;
    }

    .seat.selected {
      background: #ef78aa;
      border-color: #ef78aa;
      color: #f8fcff;
      font-weight: bold;
    }

    .seat.booked {
      background: #e6eaf0;
      border-color: #e6eaf0;
      color: #9aa7b5;
      cursor: not-allowed;
    }

    .legend {
      margin-top: 20px;
      font-size: 13px;
      color: #6d8298;
    }

    .legend span {
      display: inline-block;
      margin: 0 10px;
    }

    .legend .dot {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 4px;
      vertical-align: middle;
      margin-left: 5px;
    }

    .dot.n {
      background: #edf8ff;
      border: 1px solid #c7e3f5;
    }

    .dot.v {
      background: #fff2d2;
      border: 1px solid #f1c86b;
    }

    .dot.s {
      background: #ef78aa;
    }

    .dot.b {
      background: #e6eaf0;
    }

    /* ===== ملخص الطلب ===== */
    .summary {
      max-width: 700px;
      margin: 20px auto 60px;
      padding: 25px;
      background: #ffffff;
      border: 1px solid #d9efff;
      border-radius: 10px;
    }

    .summary h3 {
      color: #ef78aa;
      margin-bottom: 15px;
    }

    .selected-seats-list {
      font-size: 14px;
      color: #6d8298;
      margin-bottom: 10px;
      min-height: 20px;
    }

    .summary-row {
      display: block;
      padding: 6px 0;
      border-bottom: 1px dashed #d9efff;
      font-size: 15px;
    }

    .summary-row .label {
      color: #6d8298;
    }

    .summary-row .value {
      float: left;
      color: #355c8a;
    }

    .total-row {
      padding-top: 15px;
      font-size: 20px;
      font-weight: bold;
      color: #ef78aa;
    }

    .total-row .value {
      float: left;
    }

    /* ===== فورم البيانات ===== */
    .buyer-form {
      margin-top: 25px;
    }

    .buyer-form label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-size: 14px;
      color: #6d8298;
    }

    .buyer-form input {
      width: 100%;
      padding: 10px 12px;
      background: #f8fcff;
      border: 1px solid #c7e3f5;
      border-radius: 6px;
      color: #355c8a;
      font-size: 15px;
    }

    .buyer-form input:focus {
      outline: none;
      border-color: #ef78aa;
    }

    .buy-btn {
      display: block;
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      background: #ef78aa;
      color: #f8fcff;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .buy-btn:hover {
      background: #e65f96;
    }

    .buy-btn:disabled {
      background: #9aa7b5;
      color: #a5b2bf;
      cursor: not-allowed;
    }

    .success-msg {
      display: none;
      margin-top: 15px;
      padding: 18px;
      background: rgba(76, 175, 80, 0.1);
      border: 1px solid #4caf50;
      border-radius: 6px;
      color: #7fd88a;
      text-align: center;
    }

    .ticket-id {
      margin-top: 8px;
      font-size: 13px;
      color: #6d8298;
      letter-spacing: 1px;
    }

    .qr-box {
      margin-top: 15px;
      display: inline-block;
      background: #fff;
      padding: 12px;
      border-radius: 8px;
    }

    .qr-box img {
      display: block;
      width: 180px;
      height: 180px;
    }

    .qr-caption {
      margin-top: 10px;
      font-size: 12px;
      color: #8aa0b5;
    }

    .note-box {
      max-width: 700px;
      margin: 0 auto 30px;
      padding: 15px 20px;
      background: rgba(212, 175, 55, 0.08);
      border: 1px solid #f1c86b;
      border-radius: 8px;
      font-size: 13px;
      color: #6d8298;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #9aa7b5;
      font-size: 13px;
    }

    /* ===== Pastel Church Theme ===== */
    body {
      background:
        radial-gradient(circle at 10% 10%, rgba(125, 196, 246, .16), transparent 28%),
        radial-gradient(circle at 90% 12%, rgba(246, 150, 190, .16), transparent 28%),
        #f8fcff;
    }

    .hero {
      background:
        radial-gradient(circle at 20% 20%, rgba(125, 196, 246, .32), transparent 34%),
        radial-gradient(circle at 80% 20%, rgba(246, 150, 190, .30), transparent 34%),
        linear-gradient(135deg, #edf8ff 0%, #fff8fb 52%, #eef8ff 100%);
      border-bottom: 3px solid #f2b7d0;
    }

    .hero h1,
    .seats-section h2,
    .summary h3,
    .total-row {
      color: #e86f9f;
    }

    .hero p,
    .hero .event-info,
    .summary-row .value {
      color: #355c8a;
    }

    .hero .event-info span {
      background: rgba(255, 255, 255, .72);
      border-color: #a9d9f6;
      box-shadow: 0 4px 16px rgba(85, 160, 210, .10);
    }

    .stage {
      background: linear-gradient(90deg, #e8f5ff, #f4efff, #fff0f7);
      color: #5d9fd0;
      border: 1px solid #b9dff5;
    }

    .seat {
      background: #edf8ff;
      border-color: #b9dff5;
      color: #5597c8;
      box-shadow: 0 3px 8px rgba(80, 150, 205, .08);
    }

    .seat:hover {
      border-color: #ef8fb5;
      transform: translateY(-1px);
    }

    .seat.vip {
      background: #fff2d2;
      border-color: #f1ca76;
      color: #9b6a16;
    }

    .seat.selected {
      background: #d8c8ff;
      border-color: #aa91ed;
      color: #5f4a99;
      box-shadow: 0 4px 12px rgba(150, 120, 220, .20);
    }

    .seat.booked {
      background: #edf0f3;
      border-color: #d7dce2;
      color: #a8b0b8;
    }

    .summary {
      background: rgba(255, 255, 255, .92);
      border-color: #c9e7f8;
      box-shadow: 0 8px 28px rgba(90, 160, 205, .10);
    }

    .buyer-form input {
      background: #fbfdff;
      border-color: #c8e4f4;
      color: #355c8a;
    }

    .buyer-form input:focus {
      border-color: #ef8fb5;
      box-shadow: 0 0 0 3px rgba(239, 143, 181, .12);
    }

    .buy-btn {
      background: linear-gradient(90deg, #ef78aa, #f28eb6);
      color: white;
      box-shadow: 0 7px 18px rgba(239, 120, 170, .22);
    }

    .buy-btn:hover {
      background: linear-gradient(90deg, #e9639c, #ed7bab);
    }

    .note-box {
      background: linear-gradient(90deg, rgba(224, 243, 255, .75), rgba(255, 235, 245, .75));
      border-color: #b9dff5;
      color: #60778d;
    }

    footer {
      color: #8aa0b5;
    }
  </style>
</head>

<body>

  <!-- ===== هيدر الحفلة ===== -->
  <div class="hero">
    <h1>اسم الحفلة هنا</h1>
    <p>وصف قصير عن الحفلة</p>
    <div class="event-info">
      <span>📅 السبت، ٣٠ أغسطس</span>
      <span>📍 اسم المكان، المدينة</span>
      <span>🕗 الساعة ٨ مساءً</span>
    </div>
  </div>



  <!-- ===== خريطة الكراسي ===== -->
  <div class="seats-section">
    <h2>اختار كرسيك</h2>
    <div class="hint">اضغط على أي كرسي فاضي عشان تختاره</div>

    <div class="stage">المسرح</div>

    <div id="seatMap"></div>

    <div class="legend">
      <span><span class="dot n"></span>عادي</span>
      <span><span class="dot v"></span>VIP</span>
      <span><span class="dot s"></span>متاختار</span>
      <span><span class="dot b"></span>محجوز</span>
    </div>
  </div>

  <!-- ===== الملخص وبيانات المشتري ===== -->
  <div class="summary">
    <h3>ملخص الطلب</h3>

    <div class="selected-seats-list" id="selectedList">لسه ما اخترتش أي كرسي</div>

    <div class="summary-row total-row">
      <span class="label">الإجمالي:</span>
      <span class="value" id="sum-total">0 جنيه</span>
    </div>

    <div class="buyer-form">
      <label for="name">الاسم بالكامل</label>
      <input type="text" id="name" placeholder="اكتب اسمك">

      <label for="phone">رقم الموبايل</label>
      <input type="tel" id="phone" placeholder="01xxxxxxxxx">

      <button class="buy-btn" id="buyBtn" onclick="submitOrder()">إتمام الحجز</button>


    </div>

    <footer>هذا كود مبدئي — عدّل الأسعار والصفوف وربطه بقاعدة بيانات حسب احتياجك</footer>

    <script>

    </script>
    <script>
      const rows = [
        { label: 'A', type: 'vip', price: 120, seats: 8 },
        { label: 'B', type: 'vip', price: 120, seats: 8 },
        { label: 'C', type: 'normal', price: 100, seats: 10 },
        { label: 'D', type: 'normal', price: 100, seats: 10 },
        { label: 'E', type: 'normal', price: 100, seats: 10 }
      ];

      // كراسي محجوزة مسبقاً (بيانات تجريبية بس - ده اللي محتاج قاعدة بيانات حقيقية)
      const bookedSeats = ['A3', 'A4', 'C7', 'D1', 'D2'];

      const selected = {}; // مثال: { "A1": {price: 600, type: 'vip'} }

      function buildSeatMap() {
        const container = document.getElementById('seatMap');
        rows.forEach(row => {
          const rowDiv = document.createElement('div');
          rowDiv.className = 'seat-row';

          const label = document.createElement('span');
          label.className = 'row-label';
          label.textContent = row.label;
          rowDiv.appendChild(label);

          for (let i = 1; i <= row.seats; i++) {
            const seatId = row.label + i;
            const seatDiv = document.createElement('span');
            seatDiv.className = 'seat ' + row.type;
            seatDiv.id = 'seat-' + seatId;
            seatDiv.textContent = i;

            if (bookedSeats.includes(seatId)) {
              seatDiv.classList.add('booked');
            } else {
              seatDiv.onclick = () => toggleSeat(seatId, row.type, row.price);
            }

            rowDiv.appendChild(seatDiv);
          }

          container.appendChild(rowDiv);
        });
      }

      function toggleSeat(seatId, type, price) {
        const seatDiv = document.getElementById('seat-' + seatId);

        if (selected[seatId]) {
          delete selected[seatId];
          seatDiv.classList.remove('selected');
        } else {
          selected[seatId] = { type, price };
          seatDiv.classList.add('selected');
        }

        updateSummary();
      }

      function updateSummary() {
        const seatIds = Object.keys(selected);
        const total = seatIds.reduce((sum, id) => sum + selected[id].price, 0);

        const listEl = document.getElementById('selectedList');
        listEl.textContent = seatIds.length
          ? 'الكراسي المختارة: ' + seatIds.join('، ')
          : 'لسه ما اخترتش أي كرسي';

        document.getElementById('sum-total').textContent = total + ' جنيه';
        document.getElementById('buyBtn').disabled = seatIds.length === 0;
      }

      function generateTicketId() {
        // رقم عشوائي بسيط يميز كل تذكرة (لو حطيت قاعدة بيانات حقيقية هتحتاج رقم مضمون إنه مش مكرر)
        return 'TCKT-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).substring(2, 6).toUpperCase();
      }

      // لو الملف اتفتح بدبل كليك (file://) نستخدم localhost:3000 يدويًا
      // لو اتفتح من سيرفر حقيقي (لوكال أو أونلاين) نستخدم رابط نسبي عادي
      const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:3000' : '';

      async function submitOrder() {
        const name = document.getElementById('name').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const seatIds = Object.keys(selected);
        const total = seatIds.reduce((sum, id) => sum + selected[id].price, 0);

        if (!name || !phone) {
          alert('من فضلك اكتب اسمك ورقم موبايلك');
          return;
        }
        if (seatIds.length === 0) {
          alert('اختار كرسي واحد على الأقل');
          return;
        }

        document.getElementById('buyBtn').disabled = true;
        document.getElementById('buyBtn').textContent = 'جاري التوجيه لصفحة الدفع...';

        try {
          const response = await fetch(`${API_BASE}/api/create-payment`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: name,
              phone: phone,
              seats: seatIds,
              totalAmount: total
            })
          });

          const data = await response.json();

          if (data.success && data.paymentUrl) {
            window.location.href = data.paymentUrl;
          } else {
            alert('حدثت مشكلة أثناء تجهيز الفاتورة، حاول مرة أخرى.');
            document.getElementById('buyBtn').disabled = false;
            document.getElementById('buyBtn').textContent = 'إتمام الحجز';
          }
        } catch (err) {
          console.error(err);
          alert('تعذر الاتصال بالسيرفر.');
          document.getElementById('buyBtn').disabled = false;
          document.getElementById('buyBtn').textContent = 'إتمام الحجز';
        }
      }

      buildSeatMap();
    </script>

</body>

</html>
