<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فشل عملية الدفع</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            direction: rtl;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .fail-icon {
            color: #dc3545;
            font-size: 50px;
            margin-bottom: 10px;
        }

        .info-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin: 15px 0;
            text-align: right;
            font-size: 14px;
            border: 1px solid #e9ecef;
        }

        p.desc {
            color: #555;
            font-size: 15px;
        }

        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            display: inline-block;
            width: 100%;
            margin-top: 15px;
            text-decoration: none;
            box-sizing: border-box;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="fail-icon">✕</div>
        <h2>لم تكتمل عملية الدفع</h2>
        <p class="desc">حصلت مشكلة أثناء الدفع أو تم إلغاء العملية. لم يتم تأكيد حجزك ولن يتم خصم أي مبلغ.</p>

        <div class="info-box" id="booking-ref-box" style="display:none;">
            <p style="margin: 5px 0;"><strong>رقم الحجز:</strong> <span id="display-id">---</span></p>
        </div>

        <p class="desc">لو تم خصم مبلغ من حسابك رغم ذلك، تواصل معنا وابعت رقم الحجز اللي فوق.</p>

        <a class="btn" href="index.html">حاول مرة أخرى</a>
    </div>

    <script>
        window.addEventListener('load', function () {
            const urlParams = new URLSearchParams(window.location.search);
            const bookingId = urlParams.get('bookingId');

            if (bookingId) {
                document.getElementById('display-id').textContent = bookingId;
                document.getElementById('booking-ref-box').style.display = 'block';
            }
        });
    </script>

</body>

</html>
